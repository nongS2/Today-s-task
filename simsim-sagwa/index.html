<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>심심한 사과</title>
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#1c1c1e;--text2:#6e6e73;--line:#e5e5ea;
  --accent:#e5484d;--accent-light:#fdecec;--good:#2e9d5b;--good-light:#e6f6ec;
  --bad:#d9480f;--bad-light:#fff0e6;--flame:#ff8a00;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;--card:#1c1c1e;--text:#f2f2f7;--text2:#98989f;--line:#38383a;
    --accent:#ff6369;--accent-light:#3a1f21;--good:#4cc77f;--good-light:#173323;
    --bad:#ff8a4c;--bad-light:#3a2516;--flame:#ffa53d;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px;}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 20px;}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.3px;}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px;color:var(--flame);}
.streak.off{color:var(--text2);}
.progress{display:flex;gap:6px;margin-bottom:12px;}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line);}
.progress span.on{background:var(--accent);}
.card{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.label{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-light);
  padding:4px 10px;border-radius:999px;margin-bottom:16px;}
.sentence{font-size:22px;line-height:1.55;font-weight:600;margin-bottom:24px;}
.sentence mark{background:none;color:var(--accent);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;}
.question{font-size:15px;color:var(--text2);margin-bottom:12px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{width:100%;text-align:left;font:inherit;font-size:16px;line-height:1.45;color:var(--text);
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
  transition:border-color .15s,background .15s;}
.choice:hover:not(:disabled){border-color:var(--text2);}
.choice:disabled{cursor:default;}
.choice.correct{border-color:var(--good);background:var(--good-light);}
.choice.wrong{border-color:var(--bad);background:var(--bad-light);}
.choice.dim{opacity:.45;}
.feedback{margin-top:18px;padding:16px;border-radius:14px;background:var(--bg);font-size:15px;line-height:1.6;}
.feedback .verdict{font-weight:700;font-size:16px;margin-bottom:6px;}
.feedback .verdict.good{color:var(--good);}
.feedback .verdict.bad{color:var(--bad);}
.feedback .meaning{font-weight:600;margin-bottom:4px;}
.feedback .note{color:var(--text2);}
.feedback .next-review{margin-top:8px;font-size:13px;color:var(--text2);}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);
  border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--accent);}
.hint{font-size:13px;color:var(--text2);margin-top:8px;}
.btn{display:block;width:100%;margin-top:18px;font:inherit;font-size:17px;font-weight:700;color:#fff;
  background:var(--accent);border:none;border-radius:14px;padding:15px;cursor:pointer;}
.btn:disabled{opacity:.4;cursor:default;}
.done{text-align:center;padding:36px 20px;}
.done .big-flame{font-size:56px;line-height:1;margin-bottom:12px;}
.done h2{font-size:24px;margin-bottom:8px;}
.done p{color:var(--text2);font-size:15px;line-height:1.6;}
.stats{display:flex;gap:10px;margin-top:20px;}
.stat{flex:1;background:var(--bg);border-radius:14px;padding:14px 8px;}
.stat b{display:block;font-size:22px;}
.stat span{font-size:13px;color:var(--text2);}
.week{display:flex;justify-content:space-between;margin-top:20px;}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.day i{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;}
.day.on i{background:var(--flame);color:#fff;}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--text2);line-height:1.7;}
footer button{font:inherit;font-size:12px;color:var(--text2);background:none;border:none;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">심심한 사과</div>
    <div class="streak off" id="streak">🔥 0일</div>
  </header>
  <div class="progress" id="progress"></div>
  <main id="app"></main>
  <footer>
    시안 · 뜻풀이는 표준국어대사전을 참고했고, 감수 전이에요.<br>
    <button id="reset">기록 초기화</button>
  </footer>
</div>

<script>
// 단어 데이터. 문장 속 **...** 부분이 강조돼요.
// sentences[0]은 처음 배울 때, sentences[1]은 3일 뒤 복습 때 써요.
const WORDS=[
  {id:'simsim',word:'심심하다',meaning:'마음의 표현 정도가 매우 깊고 간절하다',wrong:'지루하고 재미가 없다',
   note:'심할 심(甚)에 깊을 심(深)을 써요. ‘지루하다’는 뜻의 ‘심심하다’와 소리만 같은 다른 낱말이에요.',
   sentences:['불편을 드려 **심심한** 사과의 말씀을 드립니다.','도와주신 모든 분께 **심심한** 감사를 표합니다.']},
  {id:'saheul',word:'사흘',meaning:'세 날 (3일)',wrong:'네 날 (4일)',
   note:'하루, 이틀, 사흘, 나흘 순서예요. ‘사’가 숫자 4처럼 들려서 생기는 오해예요. 순우리말이에요.',
   sentences:['축제는 **사흘** 동안 열린다.','택배가 도착하기까지 **사흘**이 걸렸다.']},
  {id:'geumil',word:'금일',meaning:'오늘',wrong:'금요일',
   note:'이제 금(今)에 날 일(日)을 써요. 금요일의 ‘금(金)’과는 다른 글자예요.',
   sentences:['과제는 **금일** 자정까지 제출하세요.','**금일** 급식은 비빔밥입니다.']},
  {id:'muun',word:'무운',meaning:'싸움이나 경기에서 이기고 지는 운수',wrong:'운이 없음',
   note:'‘무’는 싸움·군사를 뜻하는 무(武)예요. 없을 무(無)가 아니라서, 무운을 비는 건 이기기를 비는 말이에요.',
   sentences:['결승에 나서는 선수들의 **무운**을 빕니다.','장군은 떠나는 병사들의 **무운**을 빌었다.']},
  {id:'jungsik',word:'중식',meaning:'점심 끼니',wrong:'중국 음식',
   note:'가운데 중(中)에 밥 식(食)을 써요. 중국 음식도 ‘중식’이라 부르지만, 안내문의 ‘중식 제공’은 대개 점심을 뜻해요.',
   sentences:['수련회 첫날 **중식**은 12시부터 제공됩니다.','**중식** 메뉴는 김밥과 컵라면이다.']},
  {id:'gojisik',word:'고지식하다',meaning:'성질이 외곬으로 곧아 융통성이 없다',wrong:'지식 수준이 높다',
   note:'높을 고(高)와 지식(知識)이 합쳐진 말이 아니에요. 순우리말이에요.',
   sentences:['할머니는 **고지식하셔서** 한번 정한 규칙은 절대 바꾸지 않으신다.','설명서 순서대로만 **고지식하게** 하다가 시간이 오래 걸렸다.']},
  {id:'iljeol',word:'일절',meaning:'아주, 전혀, 절대로 (하지 않거나 막을 때)',wrong:'모든 것, 전부',
   note:'‘모든 것’은 ‘일체’예요. 같은 한자 一切를 쓰지만 읽는 법에 따라 뜻이 달라요.',
   sentences:['외부인의 출입을 **일절** 금합니다.','그는 그 일에 대해 **일절** 말하지 않았다.']},
  {id:'myeongil',word:'명일',meaning:'내일 (오늘의 바로 다음 날)',wrong:'명절',
   note:'밝을 명(明)에 날 일(日)을 써요. 명절의 ‘명(名)’과는 다른 글자예요.',
   sentences:['**명일** 오전 9시까지 운동장에 모입니다.','**명일** 행사는 비가 와도 진행됩니다.']},
  {id:'gyeoljae',word:'결재',meaning:'윗사람이 안건을 검토해 허가하거나 승인함',wrong:'돈을 내서 거래를 끝냄',
   note:'돈을 내는 건 ‘결제’예요. 결재는 결단할 결(決)에 마를 재(裁), 곧 결정한다는 뜻이에요.',
   sentences:['보고서는 교장 선생님의 **결재**를 받아야 한다.','**결재**가 나야 체험학습을 갈 수 있다.']},
  {id:'ucheonsi',word:'우천 시',meaning:'비가 오는 때',wrong:'‘우천’이라는 도시',
   note:'비 우(雨), 하늘 천(天), 때 시(時)를 써요. ‘우천시’라는 지명이 있는 게 아니에요.',
   sentences:['**우천 시** 체육대회는 강당에서 진행됩니다.','**우천 시** 소풍은 다음 주로 미룹니다.']}
];
const REVIEW_DAYS=[3,7]; // 3일 뒤: 다른 문장으로 다시 맞히기, 7일 뒤: 직접 문장 쓰기
const KEY='simsim-sagwa-v1';

// 날짜 (테스트용: 주소 뒤에 ?date=2026-11-03 처럼 붙이면 그 날짜로 동작해요)
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const override=new URLSearchParams(location.search).get('date');
const TODAY=/^\d{4}-\d{2}-\d{2}$/.test(override||'')?override:fmt(new Date());

// 기록 저장. 사파리 사생활 보호 모드처럼 저장이 막혀도 화면은 동작해요
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load()||{days:{},cards:{}};

// 빠진 날이 있어도 단어를 건너뛰지 않도록, 아직 안 배운 단어를 순서대로 꺼내요
const todayWord=()=>WORDS.find(w=>!state.cards[w.id]);

// 오늘 할 일: 새 단어 1개 + 복습 날짜가 된 단어들
function buildQueue(){
  const q=[];
  const w=todayWord();
  if(w&&!state.days[TODAY])q.push({type:'new',w});
  for(const word of WORDS){
    const c=state.cards[word.id];
    if(!c||c.learned===TODAY)continue;
    REVIEW_DAYS.forEach(n=>{
      if(!c.reviews[n]&&diffDays(c.learned,TODAY)>=n)q.push({type:n===7?'write':'review',w:word,step:n});
    });
  }
  return q;
}

function streak(){
  let s=0,d=state.days[TODAY]?TODAY:addDays(TODAY,-1);
  while(state.days[d]){s++;d=addDays(d,-1);}
  return s;
}

const app=document.getElementById('app');
let queue=buildQueue(),pos=0;
const total=queue.length;

function renderHeader(){
  const s=streak(),el=document.getElementById('streak');
  el.textContent=`🔥 ${s}일`;
  el.classList.toggle('off',!state.days[TODAY]);
  const bar=document.getElementById('progress');
  bar.innerHTML='';
  if(total>1)for(let i=0;i<total;i++){const sp=document.createElement('span');if(i<pos)sp.className='on';bar.appendChild(sp);}
}

function sentenceHTML(s){
  const esc=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return esc.replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
}

function render(){
  renderHeader();
  if(pos>=queue.length)return renderDone();
  const item=queue[pos];
  item.type==='write'?renderWrite(item):renderQuiz(item);
}

function renderQuiz(item){
  const {w}=item,isReview=item.type==='review';
  const sentence=w.sentences[isReview?1:0];
  // 정답 위치는 단어마다 다르게, 하지만 매번 같은 자리로
  const flip=(w.id.charCodeAt(0)+(isReview?1:0))%2===1;
  const opts=flip?[w.wrong,w.meaning]:[w.meaning,w.wrong];
  app.innerHTML=`
    <div class="card">
      <div class="label">${isReview?'복습 · 3일 전에 만난 단어':'오늘의 한 줄'}</div>
      <p class="sentence">${sentenceHTML(sentence)}</p>
      <p class="question">여기서 ‘${w.word}’의 뜻은?</p>
      <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join('')}</div>
      <div id="after"></div>
    </div>`;
  app.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>answer(item,opts,btn)));
}

function answer(item,opts,btn){
  const {w}=item,picked=opts[btn.dataset.i],ok=picked===w.meaning;
  app.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const isAnswer=opts[b.dataset.i]===w.meaning;
    if(isAnswer)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(item.type==='new'){
    state.cards[w.id]={learned:TODAY,reviews:{},wrong:ok?0:1};
    state.days[TODAY]=true;
  }else{
    state.cards[w.id].reviews[item.step]=TODAY;
    if(!ok)state.cards[w.id].wrong++;
  }
  save();
  renderHeader();
  const next=item.type==='new'?'3일 뒤에 다른 문장으로 다시 만나요.':'4일 뒤에는 이 단어로 직접 문장을 써 봐요.';
  document.getElementById('after').innerHTML=`
    <div class="feedback">
      <div class="verdict ${ok?'good':'bad'}">${ok?'정답이에요!':'아쉬워요, 이렇게 기억해요'}</div>
      <div class="meaning">${w.word}: ${w.meaning}</div>
      <div class="note">${w.note}</div>
      <div class="next-review">${next}</div>
    </div>
    <button class="btn" id="next">${pos+1<queue.length?'다음':'완료'}</button>`;
  document.getElementById('next').addEventListener('click',()=>{pos++;render();});
}

function renderWrite(item){
  const {w}=item;
  app.innerHTML=`
    <div class="card">
      <div class="label">내 문장 쓰기 · 7일 전에 만난 단어</div>
      <p class="sentence"><mark>${w.word}</mark></p>
      <p class="question">뜻: ${w.meaning}</p>
      <textarea id="mine" placeholder="‘${w.word}’를 넣어 나만의 문장을 써 보세요"></textarea>
      <p class="hint">일주일 전에 처음 만난 단어예요. 직접 써 보면 가장 오래 기억에 남아요.</p>
      <button class="btn" id="save" disabled>저장</button>
    </div>`;
  const ta=document.getElementById('mine'),btn=document.getElementById('save');
  ta.addEventListener('input',()=>{btn.disabled=ta.value.trim().length<4;});
  btn.addEventListener('click',()=>{
    const c=state.cards[w.id];
    c.reviews[7]=TODAY;c.mine=ta.value.trim();
    save();pos++;render();
  });
}

function renderDone(){
  const s=streak(),learned=Object.keys(state.cards).length;
  const days=[...Array(7)].map((_,i)=>addDays(TODAY,i-6));
  const names=['일','월','화','수','목','금','토'];
  app.innerHTML=`
    <div class="card done">
      <div class="big-flame">🔥</div>
      <h2>${state.days[TODAY]?`${s}일 연속!`:'준비된 문장을 다 풀었어요'}</h2>
      <p>${state.days[TODAY]?'오늘의 한 줄을 마쳤어요.<br>내일 새 문장으로 또 만나요.':'새 단어가 추가되면 다시 시작돼요.'}</p>
      <div class="stats">
        <div class="stat"><b>${learned}</b><span>모은 단어</span></div>
        <div class="stat"><b>${s}</b><span>연속 일수</span></div>
      </div>
      <div class="week">${days.map(d=>`<div class="day ${state.days[d]?'on':''}"><i>${state.days[d]?'✓':''}</i>${names[parse(d).getDay()]}</div>`).join('')}</div>
    </div>`;
}

document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('지금까지의 기록을 모두 지울까요?'))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  location.reload();
});

render();
</script>
</body>
</html>
